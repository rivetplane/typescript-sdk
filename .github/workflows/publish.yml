name: Publish TypeScript SDK

on:
  push:
    tags: ["sdk-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    concurrency:
      group: npm-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run browser:check
      - run: npm run package:verify
      - name: Match tag and package versions
        run: |
          test "${GITHUB_REF_NAME#sdk-v}" = "$(node -p "require('./package.json').version")"
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Reject a duplicate version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view "@rivetplane/sdk@${PACKAGE_VERSION}" version >/dev/null 2>&1; then
            echo "@rivetplane/sdk@${PACKAGE_VERSION} already exists" >&2
            exit 1
          fi
      - name: Publish with provenance
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
