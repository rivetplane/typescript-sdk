name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run browser:check
      - run: npm run package:verify
      - name: Verify Bun import
        run: bun -e "import { Rivetplane } from './dist/index.js'; if (!new Rivetplane({baseUrl:'https://example.test', authentication:'test'}).sessions) process.exit(1)"

  node-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run package:verify
